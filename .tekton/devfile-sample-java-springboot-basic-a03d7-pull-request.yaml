apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/jsztuka/devfile-sample-java-springboot-basic?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rox
    appstudio.openshift.io/component: devfile-sample-java-springboot-basic-a03d7
    pipelines.appstudio.openshift.io/type: build
  name: devfile-sample-java-springboot-basic-a03d7-on-pull-request
  namespace: jsztuka-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/jsztuka-tenant/devfile-sample-java-springboot-basic-a03d7:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfile
  pipelineSpec:
    description: |
      This pipeline is ideal for building demo container images from a Containerfile while maintaining trust after pipeline customization.

      This version of pipeline has minimal resource requests set, it's good for demonstrating and testing.

      _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
      This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where
        to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter
        path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "false"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Add built image into an OCI image index
      name: build-image-index
      type: string
    - default: docker
      description: The format for the resulting image's mediaType. Valid values are
        oci or docker.
      name: buildah-format
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    - default: "false"
      description: Whether to enable privileged mode, should be used only with remote
        VMs
      name: privileged-nested
      type: string
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4@sha256:288f3106118edc1d0f0c79a89c960abf5841a4dd8bc3f38feb10527253105b19
        - name: kind
          value: task
        resolver: bundles
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta-min:0.1@sha256:2fff50eaed7d278c3ed82375d28241eaf6eecbc389ec4d44992721786a0dfa68
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta-min:0.3@sha256:2ddbfbed09a713235c2d7004917475aa6fa5c4d9d19b3967c6537cdd4ba9b3d4
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: build-container
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: PREFETCH_INPUT
        value: $(params.prefetch-input)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      - name: BUILD_ARGS_FILE
        value: $(params.build-args-file)
      - name: PRIVILEGED_NESTED
        value: $(params.privileged-nested)
      - name: SOURCE_URL
        value: $(tasks.clone-repository.results.url)
      - name: BUILDAH_FORMAT
        value: $(params.buildah-format)
      - name: HTTP_PROXY
        value: $(tasks.init.results.http-proxy)
      - name: NO_PROXY
        value: $(tasks.init.results.no-proxy)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CACHI2_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
      - prefetch-dependencies
      taskRef:
        params:
        - name: name
          value: buildah-oci-ta-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta-min:0.9@sha256:4caebda24c98adc305bf40b94ad8915d85930699f94a79ce8f04a1466ddabf09
        - name: kind
          value: task
        resolver: bundles
    - name: build-image-index
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: ALWAYS_BUILD_INDEX
        value: $(params.build-image-index)
      - name: IMAGES
        value:
        - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
      - name: BUILDAH_FORMAT
        value: $(params.buildah-format)
      runAfter:
      - build-container
      taskRef:
        params:
        - name: name
          value: build-image-index-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-image-index-min:0.2@sha256:46ef245ad011cbccedfc96c2a0d3e6013c8f3798b3bc637b14b5088d260d0ffd
        - name: kind
          value: task
        resolver: bundles
    - name: deprecated-base-image-check
      params:
      - name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: deprecated-image-check
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:3457a4ca93f8d55f14ebd407532b1223c689eacc34f0abb3003db4111667bdae
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: roxctl-scan
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: roxctl-scan
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-roxctl-scan:0.2@sha256:78e49dd18ed8e438d28cbd27e7d93f98b3dab35dd77df7930810b747c6033d6e
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: calculate-safe-dates
      runAfter:
      - roxctl-scan
      params:
        - name: rhsas-values
          value: "$(tasks.roxctl-scan.results.ACS_RHSAS)"
      taskSpec:
        steps:
          - name: first-step
            image: quay.io/konflux-ci/konflux-test:v1.5.10@sha256:2f9960d60c0e4aa0c2fba42b147736fab5bd11644577cff60ec4255a392be252
            script: |
              #!/usr/bin/env bash
              # store result in jq readable format
              storedRhsas='$(params.rhsas-values)'
              # first make sure we recieved something and we can read it, 1. check if result is truncated, 2. check if it is empty
              # 3. check for dates
              # This is a failfast section
              #VARS
              severities=""
              skipCrit=false
              skipImp=false
              days=0
              found=""
              jq '.' <<< $storedRhsas
              if [ $(jq 'has("truncated")' <<< $storedRhsas) = true ]; then
                  echo "Result has been overflown, exiting now!"
                  exit 0
              elif [ $(jq '.CRITICAL | length == 0' <<< $storedRhsas ) = true ] && [ $(jq '.IMPORTANT | length == 0' <<< $storedRhsas) = true ]; then
                  echo "No Critical or Important severity RHSAs found."
                  echo "Overal result:"
              cat << "EOF"
              /$$$$$$$   /$$$$$$   /$$$$$$   /$$$$$$ 
              | $$__  $$ /$$__  $$ /$$__  $$ /$$__  $$
              | $$  \ $$| $$  \ $$| $$  \__/| $$  \__/
              | $$$$$$$/| $$$$$$$$|  $$$$$$ |  $$$$$$ 
              | $$____/ | $$__  $$ \____  $$ \____  $$
              | $$      | $$  | $$ /$$  \ $$ /$$  \ $$
              | $$      | $$  | $$|  $$$$$$/|  $$$$$$/
              |__/      |__/  |__/ \______/  \______/ 
              EOF
                  exit 0
              fi


              # Prepare for a curl format
              if [ $(jq '.CRITICAL | length != 0' <<< $storedRhsas ) = true ]; then
                  criticalRhsas=$(jq '.CRITICAL[]' <<< $storedRhsas)
                  criticalCurlInput=$(jq -Rrs 'split("\n") | map(select(length > 0)) | join(",") | gsub("\""; "")' <<< $criticalRhsas)
                  curl GET https://access.redhat.com/hydra/rest/securitydata/csaf.json?rhsa_ids=$criticalCurlInput > CRITICALSecurityDataOut.json
              else
                  skipCrit=true
              fi
              if [ $(jq '.IMPORTANT | length != 0' <<< $storedRhsas ) = true ]; then
                  importantRhsas=$(jq '.IMPORTANT[]' <<< $storedRhsas)
                  importantCurlInput=$(jq -Rrs 'split("\n") | map(select(length > 0)) | join(",") | gsub("\""; "")' <<< $importantRhsas)
                  curl GET https://access.redhat.com/hydra/rest/securitydata/csaf.json?rhsa_ids=$importantCurlInput > IMPORTANTSecurityDataOut.json
              else
                  skipImp=true
              fi

              # Parse output to standardized format
              if ( $skipCrit = true); then
                  severities=("IMPORTANT")
              fi
              if ( $skipImp = true); then
                  severities=("CRITICAL")
              fi
              if [[ "$skipCrit" = false && "$skipImp" = false ]]; then
                  severities=("IMPORTANT" "CRITICAL")
              fi

              for sev in "${severities[@]}"
              do
                  jq '
                  [
                  {
                      RHSA: (
                      reduce .[] as $item
                          ({};
                          if ($item.severity | type) == "string" then
                              ($item.severity | ascii_upcase) as $severity
                              | .[$severity] = (
                                  (.[$severity] // []) + [{
                                  advisory: $item.RHSA,
                                  released_on: $item.released_on,
                                  CVEs: $item.CVEs
                                  }]
                              )
                          else
                              .
                          end
                          )
                      )
                  }
                  ]
                  | select(.[0].RHSA | length > 0)
                  ' ${sev}SecurityDataOut.json > parsed${sev}Rhsa.json
              done

              # Calculate dates
              for sev in "${severities[@]}"
              do
                  if [[ "$sev" = "IMPORTANT" ]]; then
                      days=90
                  elif [[ "$sev" = "CRITICAL" ]]; then
                      days=30
                  fi
                  jq \
                      --arg severity "$sev" \
                      --argjson days "$days" '
                      map(
                      .RHSA[$severity] |= map(
                          (.released_on | fromdateiso8601) as $released
                          | ($released + ($days * 24 * 60 * 60)) as $safe_until
                          | . + {
                              safe_until: ($safe_until | todateiso8601),
                              is_past_due: ($safe_until < now)
                          }
                      )
                      )
                      ' parsed${sev}Rhsa.json > ${sev}CalculatedDates.json
              done

              # Final announcement
              cat << "EOF"
              /$$ /$$  /$$$$$$    /$$     /$$                           /$$     /$$                     /$$ /$$
              | $$| $$ /$$__  $$  | $$    | $$                          | $$    |__/                    | $$| $$
              | $$| $$| $$  \ $$ /$$$$$$ /$$$$$$    /$$$$$$  /$$$$$$$  /$$$$$$   /$$  /$$$$$$  /$$$$$$$ | $$| $$
              | $$| $$| $$$$$$$$|_  $$_/|_  $$_/   /$$__  $$| $$__  $$|_  $$_/  | $$ /$$__  $$| $$__  $$| $$| $$
              |__/|__/| $$__  $$  | $$    | $$    | $$$$$$$$| $$  \ $$  | $$    | $$| $$  \ $$| $$  \ $$|__/|__/
                      | $$  | $$  | $$ /$$| $$ /$$| $$_____/| $$  | $$  | $$ /$$| $$| $$  | $$| $$  | $$        
              /$$ /$$| $$  | $$  |  $$$$/|  $$$$/|  $$$$$$$| $$  | $$  |  $$$$/| $$|  $$$$$$/| $$  | $$ /$$ /$$
              |__/|__/|__/  |__/   \___/   \___/   \_______/|__/  |__/   \___/  |__/ \______/ |__/  |__/|__/|__/
              EOF

              echo "REPORTED RESULTS ARE FOR THIS EXACT MOMENT/TIME. ONCE RUN ON DIFFERENT PLACE(COLLECTORS), THE RESULTS MAY DIFFER."

              # Merge json in case both severities are present
              if [ ${#severities[@]} -gt 1 ]; then
                  echo "Merging jsons together"
                  jq -s add *CalculatedDates.json > merged.json
              # Report what has been found
                  found=$(jq '
                      map(
                          .RHSA |= with_entries(
                              .value |= map(
                                  select(.is_past_due == true)
                              )
                          )
                          | select([.RHSA[] | length > 0] | any)
                      )
                      ' merged.json)
              else

                  found=$(jq '
                      map(
                          .RHSA |= with_entries(
                              .value |= map(
                                  select(.is_past_due == true)
                              )
                          )
                      )
                      | map(select([.RHSA[] | length > 0] | any))
                      ' ${sev}CalculatedDates.json)
              fi
                  if [[ $found == "[]" ]]; then
                    echo "Critical or Important RHSAs has been found, but they are within date tolerance. Important (90 days within release) Critical (30 days within release)."
                    echo "Your overal result is:"
              cat << "EOF"
              /$$      /$$  /$$$$$$  /$$$$$$$  /$$   /$$
              | $$  /$ | $$ /$$__  $$| $$__  $$| $$$ | $$
              | $$ /$$$| $$| $$  \ $$| $$  \ $$| $$$$| $$
              | $$/$$ $$ $$| $$$$$$$$| $$$$$$$/| $$ $$ $$
              | $$$$_  $$$$| $$__  $$| $$__  $$| $$  $$$$
              | $$$/ \  $$$| $$  | $$| $$  \ $$| $$\  $$$
              | $$/   \  $$| $$  | $$| $$  | $$| $$ \  $$
              |__/     \__/|__/  |__/|__/  |__/|__/  \__/
              EOF
                  else
                      echo "Critical or Important RHSAs has been found past their date tolerance. Important (90 days within release) Critical (30 days within release)."
                      echo "Your overal result is:"
              cat << "EOF"
              /$$$$$$$  /$$        /$$$$$$   /$$$$$$  /$$   /$$
              | $$__  $$| $$       /$$__  $$ /$$__  $$| $$  /$$/
              | $$  \ $$| $$      | $$  \ $$| $$  \__/| $$ /$$/ 
              | $$$$$$$ | $$      | $$  | $$| $$      | $$$$$/  
              | $$__  $$| $$      | $$  | $$| $$      | $$  $$  
              | $$  \ $$| $$      | $$  | $$| $$    $$| $$\  $$ 
              | $$$$$$$/| $$$$$$$$|  $$$$$$/|  $$$$$$/| $$ \  $$
              |_______/ |________/ \______/  \______/ |__/  \__/
              EOF
                      echo "Found RHSAS past tolerable date:"
                      echo $found
                  fi
    - name: clamav-scan
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: clamav-scan-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan-min:0.3@sha256:5e30baedef34088fa9f120ea2fd944ce0baa182add85b307137f38f01e6106e5
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: sast-shell-check
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CACHI2_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: sast-shell-check-oci-ta-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta-min:0.1@sha256:fa19753f59288a397aab2ddb9459f35f0ec1b89f43c36e944a3958db72becb5a
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: sast-unicode-check
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      - name: CACHI2_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: sast-unicode-check-oci-ta-min
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta-min:0.4@sha256:624d9ed6d461b59a16d8c1578276626c02fa6d56e0ee4bcd752f7859055f21ab
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: rpms-signature-scan
      params:
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: rpms-signature-scan
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2@sha256:47b81d6b3d752649eddfbb8b3fd8f6522c4bb07f6d1946f9bc45dae3f92e2c9a
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: tpa-scan
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: tpa-scan
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-tpa-scan:0.1@sha256:68b6e188f742da92af9c40a794fd021a65d49b419d1e36096277b2d9ebbe1afc
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-devfile-sample-java-springboot-basic-a03d7
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
